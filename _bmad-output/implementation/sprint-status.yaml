# STORY STATUS DEFINITIONS
# =========================
# not-started: Story not yet begun
# ready-for-dev: Story is ready to implement (acceptance criteria clear, dependencies met)
# in-progress: Story currently being developed
# code-review: Story development complete, awaiting review
# testing: Story in testing phase
# blocked: Story blocked by dependency or issue
# completed: Story fully implemented, tested, and merged
# deferred: Story moved to future sprint

